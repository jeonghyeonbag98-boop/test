<title>컴활 1급 필기 CBT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like an OMR answer sheet; choices are bubbles that get "marked", then graded green/red. */
:root {
  --paper: #f3f5f9;
  --sheet: #ffffff;
  --ink: #171a24;
  --muted: #5b6173;
  --faint: #8a90a2;
  --rule: #dfe3ec;
  --accent: #2f55d4;
  --accent-ink: #ffffff;
  --accent-soft: #e7edff;
  --omr: #d8436f;
  --omr-soft: #fbe7ee;
  --ok: #17855a;
  --ok-soft: #e2f4ea;
  --bad: #d23d32;
  --bad-soft: #fde7e4;
  --shadow: 0 1px 2px rgba(20, 28, 60, .06), 0 4px 14px rgba(20, 28, 60, .05);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --img-filter: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10131b; --sheet: #191d28; --ink: #e9ecf4; --muted: #a3a9ba; --faint: #767d90; --rule: #2b3142;
    --accent: #7f9bff; --accent-ink: #0d1220; --accent-soft: #232c4a; --omr: #f07da0; --omr-soft: #3a2230;
    --ok: #4fcf93; --ok-soft: #173a2a; --bad: #ff7b6e; --bad-soft: #432220;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --img-filter: brightness(.92); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10131b; --sheet: #191d28; --ink: #e9ecf4; --muted: #a3a9ba; --faint: #767d90; --rule: #2b3142;
  --accent: #7f9bff; --accent-ink: #0d1220; --accent-soft: #232c4a; --omr: #f07da0; --omr-soft: #3a2230;
  --ok: #4fcf93; --ok-soft: #173a2a; --bad: #ff7b6e; --bad-soft: #432220;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --img-filter: brightness(.92); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  word-break: keep-all; overflow-wrap: anywhere;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- home ---------- */
.home { padding-block: 22px 40px; display: grid; gap: 22px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 1.55rem; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }
.brand h1 em { font-style: normal; color: var(--omr); }
.brand p { margin: 0; color: var(--muted); font-size: .9rem; }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 12px 10px; }
.stat b { display: block; font-family: var(--font-num); font-size: 1.35rem; line-height: 1.2; font-weight: 600; }
.stat span { font-size: .78rem; color: var(--muted); letter-spacing: .02em; }
.stat.hot b { color: var(--bad); }

.wrongnote { background: var(--sheet); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--rule); display: grid; gap: 12px; }
.wrongnote h2 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
.wrongnote h2 .count { font-family: var(--font-num); color: var(--bad); }
.wrongnote p { margin: 0; color: var(--muted); font-size: .92rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: .88rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-height: 36px; }
.chip b { font-family: var(--font-num); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chip:disabled { opacity: .45; cursor: default; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 12px 18px; min-height: 48px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-size: 1rem; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.block { width: 100%; }
.row-btns { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

.topw { display: grid; gap: 6px; }
.topw h3 { margin: 0; font-size: .82rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.topw ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tw { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; gap: 0 10px; align-items: center; text-align: left; border: 0; background: var(--paper); border-radius: 10px; padding: 8px 12px; cursor: pointer; min-height: 48px; }
.tw-src { font-size: .74rem; color: var(--muted); }
.tw-q { grid-row: 2; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tw-n { grid-row: 1 / span 2; grid-column: 2; color: var(--bad); font-weight: 600; font-size: .95rem; }
.group { display: grid; gap: 10px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.group-head h2 { margin: 0; font-size: 1.02rem; }
.group-head span { color: var(--faint); font-size: .82rem; }
.list { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; width: 100%; text-align: left; padding: 13px 14px; border: 0; background: none; cursor: pointer; border-top: 1px solid var(--rule); min-height: 60px; }
.item:first-child { border-top: 0; }
.item:active { background: var(--paper); }
.item .t { font-weight: 600; font-size: .98rem; }
.item .meta { grid-column: 1 / 2; display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: .8rem; }
.item .meta .w { color: var(--bad); }
.item .right { grid-row: 1 / span 2; grid-column: 2; text-align: right; display: grid; justify-items: end; gap: 2px; }
.item .right .score { font-family: var(--font-num); font-weight: 600; font-size: 1rem; }
.item .right .score.pass { color: var(--ok); }
.item .right .score.fail { color: var(--bad); }
.item .right small { color: var(--faint); font-size: .72rem; }
.bar { height: 4px; border-radius: 4px; background: var(--rule); overflow: hidden; width: 100%; max-width: 160px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.foot { color: var(--faint); font-size: .78rem; display: grid; gap: 4px; }
.foot .sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 1px; }
.foot .sync.on::before { background: var(--ok); }

/* ---------- quiz ---------- */
.qbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.qbar .wrap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px; height: 52px; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
.icon-btn:active { background: var(--rule); }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.qbar .title { min-width: 0; }
.qbar .title b { display: block; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qbar .title span { font-size: .78rem; color: var(--muted); font-family: var(--font-num); }
.qbar .grid-btn { display: flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 0 10px; height: 38px; cursor: pointer; font-family: var(--font-num); font-size: .88rem; }
.qbar .grid-btn svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2; }
.progress { height: 3px; background: var(--rule); }
.progress i { display: block; height: 100%; background: var(--omr); transition: width .25s ease; }

.qmain { padding-block: 16px 120px; display: grid; gap: 16px; }
.qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qno { font-family: var(--font-num); font-weight: 600; font-size: 1.15rem; color: var(--omr); min-width: 1.6em; }
.tag { font-size: .76rem; color: var(--muted); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 8px; }
.wbadge { font-size: .76rem; color: var(--bad); background: var(--bad-soft); border-radius: 6px; padding: 2px 8px; font-weight: 600; }
.stem { font-size: 1.04rem; font-weight: 500; display: grid; gap: 10px; }
.stem p, .ct p, .expl p { margin: 0; }
.box { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; font-size: .95rem; font-weight: 400; overflow-x: auto; }
.fig { display: block; width: fit-content; border: 0; padding: 0; background: #fff; border-radius: 6px; cursor: zoom-in; max-width: 100%; justify-self: start; box-shadow: 0 0 0 1px var(--rule); }
.fig img { display: block; max-width: 100%; height: auto; border-radius: 6px; filter: var(--img-filter); }
span.fig { cursor: inherit; }
img.inl { height: 1.1em; width: auto; vertical-align: -0.15em; margin: 0 2px; }

.choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ch { width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 12px; cursor: pointer; min-height: 52px; transition: border-color .15s, background .15s; }
.ch:hover { border-color: var(--faint); }
.ch:disabled { cursor: default; }
.bub { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--omr); color: var(--omr); display: grid; place-items: center; font-family: var(--font-num); font-size: .9rem; font-weight: 600; margin-top: -1px; background: var(--sheet); }
.ct { display: grid; gap: 6px; font-size: .98rem; padding-top: 1px; min-width: 0; }
.ch.correct { border-color: var(--ok); background: var(--ok-soft); }
.ch.correct .bub { background: var(--ok); border-color: var(--ok); color: #fff; }
.ch.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ch.wrong .bub { background: var(--bad); border-color: var(--bad); color: #fff; }
.ch.dim { opacity: .62; }

.fb { border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb strong { font-size: 1.15rem; }
.fb span { color: var(--ink); font-size: .92rem; }
.expl { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; font-size: .95rem; }
.expl h3 { margin: 0; font-size: .85rem; color: var(--accent); letter-spacing: .04em; }
.expl .box { background: var(--paper); }
.empty-expl { color: var(--muted); }

.qnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
.qnav .wrap { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; padding-block: 10px; }

/* sheet (navigator) */
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 12, 20, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--sheet); width: 100%; max-width: 720px; max-height: 80vh; border-radius: 18px 18px 0 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet header { display: flex; justify-content: space-between; align-items: center; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); gap: 8px; }
.sheet header b { font-size: 1rem; }
.legend { display: flex; gap: 10px; font-size: .75rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.cells { overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; align-content: start; }
.cell { position: relative; height: 44px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); font-family: var(--font-num); font-size: .9rem; cursor: pointer; }
.cell.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.cell.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cell.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell sup { position: absolute; top: -5px; right: -4px; background: var(--bad); color: #fff; font-size: .62rem; border-radius: 8px; padding: 0 4px; line-height: 15px; font-family: var(--font-num); }

.sheet-foot { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); }
/* zoom */
.zoom { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 16, .92); overflow: auto; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 16px max(8px, env(safe-area-inset-left, 0px)); }
.zoom img { background: #fff; width: 100%; max-width: 980px; height: auto; border-radius: 4px; }
.zoom.big img { width: 200%; max-width: none; }
.zoom .close { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); background: rgba(255,255,255,.16); border: 0; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; }
.zoom p { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: 0; right: 0; text-align: center; color: rgba(255,255,255,.7); font-size: .8rem; margin: 0; }

/* result */
.result { padding-block: 22px 40px; display: grid; gap: 16px; }
.scorecard { background: var(--sheet); border-radius: 16px; border: 1px solid var(--rule); padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.bigscore { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bigscore b { font-family: var(--font-num); font-size: 2.6rem; line-height: 1; }
.bigscore span { color: var(--muted); }
.verdict { font-weight: 700; padding: 4px 10px; border-radius: 8px; font-size: .9rem; }
.verdict.pass { background: var(--ok-soft); color: var(--ok); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); }
.secrow { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3.6em; gap: 10px; align-items: center; font-size: .9rem; }
.secrow .bar { max-width: none; height: 8px; }
.secrow .bar i.low { background: var(--bad); }
.secrow b { font-family: var(--font-num); text-align: right; }
.note { color: var(--muted); font-size: .82rem; margin: 0; }
.btns { display: grid; gap: 8px; }
.loading { padding: 40px 0; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"><div class="wrap loading">문제를 불러오는 중…</div></div>

<script>
(() => {
'use strict';
const MARK = ['①', '②', '③', '④'];
const LS_KEY = 'cbt-ch1-v1';
const SECN = { 1: '컴퓨터 일반', 2: '스프레드시트 일반', 3: '데이터베이스 일반' };
let DATA = null;
const QMAP = {};           // key -> {sid, q, idx}
const SETS = {};           // sid -> set meta
let S = { v: 1, st: {}, ss: {}, u: 0 };
const remote = { ref: null, on: false, timer: 0, busy: false, dirty: false };
const app = document.getElementById('app');

/* ---------------- storage ---------------- */
function readLocal() {
  try { const t = localStorage.getItem(LS_KEY); if (t) { const o = JSON.parse(t); if (o && o.st) return o; } } catch (e) {}
  return null;
}
function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
function mergeState(a, b) {
  const out = { v: 1, st: {}, ss: {}, u: Math.max(a.u || 0, b.u || 0) };
  const sids = new Set([...Object.keys(a.st || {}), ...Object.keys(b.st || {})]);
  for (const sid of sids) {
    const A = (a.st || {})[sid] || {}, B = (b.st || {})[sid] || {};
    const o = {};
    for (const n of new Set([...Object.keys(A), ...Object.keys(B)])) {
      const ra = A[n], rb = B[n];
      o[n] = !ra ? rb : !rb ? ra : (ra[0] !== rb[0] ? (ra[0] > rb[0] ? ra : rb) : ((ra[3] || 0) >= (rb[3] || 0) ? ra : rb));
    }
    out.st[sid] = o;
  }
  for (const id of new Set([...Object.keys(a.ss || {}), ...Object.keys(b.ss || {})])) {
    const sa = (a.ss || {})[id], sb = (b.ss || {})[id];
    out.ss[id] = !sa ? sb : !sb ? sa : ((sa.u || 0) >= (sb.u || 0) ? sa : sb);
  }
  return out;
}
function persist() {
  S.u = Date.now();
  writeLocal();
  if (remote.on) { remote.dirty = true; clearTimeout(remote.timer); remote.timer = setTimeout(flushRemote, 1200); }
}
async function flushRemote() {
  if (!remote.on || remote.busy || !remote.dirty) return;
  remote.busy = true; remote.dirty = false;
  try { await remote.ref.set(JSON.parse(JSON.stringify(S))); }
  catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { remote.on = false; refreshSync(); }
    else remote.dirty = true;
  }
  remote.busy = false;
  if (remote.dirty && remote.on) { clearTimeout(remote.timer); remote.timer = setTimeout(flushRemote, 3000); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushRemote(); });
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms))]); }
async function initRemote() {
  try {
    if (!window.claude || !window.claude.use) return;
    const user = await window.claude.use('user'); if (!user) return;
    const uid = await user.id(); if (!uid) return;
    const db = await window.claude.use('db'); if (!db) return;
    const ref = db.doc('data/users/' + uid + '/state');
    const snap = await withTimeout(ref.get(), 10000);
    const before = JSON.stringify(S);
    if (snap.exists) {
      const rs = JSON.parse(JSON.stringify(snap.data()));
      S = mergeState(S, rs);
      writeLocal();
      remote.dirty = JSON.stringify(S) !== JSON.stringify(mergeState(rs, rs));
    } else {
      remote.dirty = Object.keys(S.st).length > 0;
    }
    remote.ref = ref; remote.on = true;
    if (remote.dirty) remote.timer = setTimeout(flushRemote, 500);
    if (JSON.stringify(S) !== before) route(); else refreshSync();
  } catch (e) { remote.on = false; }
}
function refreshSync() { const el = document.querySelector('.sync'); if (el) syncLabel(el); }
function syncLabel(el) {
  el.classList.toggle('on', remote.on);
  el.textContent = remote.on ? '기록이 계정에 저장돼 휴대폰·PC 어디서나 이어집니다' : '기록이 이 기기 브라우저에 저장됩니다';
}

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function rich(s) {
  return esc(s).replace(/⟦(img\/[^⟧]+)⟧/g, (_, src) => `<img class="inl" src="${src}" alt="">`);
}
function blocks(bs, inChoice) {
  return bs.map(b => {
    if (b.t === 'img') {
      const w = Math.round(b.w * 1.55), h = Math.round(b.h * 1.55);
      const img = `<img src="${esc(b.src)}" width="${w}" height="${h}" loading="lazy" alt="${inChoice ? '보기 그림' : '문제 그림'}">`;
      if (inChoice) return `<span class="fig">${img}</span>`;
      return `<button type="button" class="fig" data-zoom="${esc(b.src)}" aria-label="그림 크게 보기">${img}</button>`;
    }
    if (b.t === 'box') return `<div class="box">${rich(b.s)}</div>`;
    return `<p>${rich(b.s)}</p>`;
  }).join('');
}
const key = (sid, n) => sid + ':' + n;

  const g = t.closest('[data-go]'); if (g) { const to = g.dataset.go; if (location.hash.slice(1) === to) route(); else location.hash = to; return; }
  const st = t.closest('[data-start]'); if (st) { startSession(st.dataset.start); return; }
  const wj = t.closest('[data-wjump]');
  if (wj) {
    const list = wrongKeys('all'); const i = list.indexOf(wj.dataset.wjump);
    S.ss.wrong = { list, pos: Math.max(0, i), picks: {}, u: Date.now() }; persist();
    location.hash = 'q-wrong'; return;
  }
  const wm = t.closest('[data-wmode]'); if (wm && !wm.disabled) { wrongMode = wm.dataset.wmode; renderHome(); return; }
  if (t.closest('[data-sheet]')) { openSheet(); return; }
});
document.addEventListener('keydown', e => {
  if (!curId || document.querySelector('.sheet-bg,.zoom') || !location.hash.startsWith('#q-')) {
    if (e.key === 'Escape') document.querySelectorAll('.sheet-bg,.zoom').forEach(x => x.remove());
    return;
  }
  if (['1', '2', '3', '4'].includes(e.key)) { const b = app.querySelector(`[data-pick="${+e.key - 1}"]`); if (b && !b.disabled) pick(+e.key - 1); }
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
});

/* ---------------- boot ---------------- */
async function boot() {
  const local = readLocal(); if (local) S = mergeState(local, local);
  try {
    const res = await fetch('data.json');
    DATA = await res.json();
  } catch (e) {
    app.innerHTML = '<div class="wrap loading">문제 파일을 불러오지 못했어요. 페이지를 새로 고쳐 주세요.</div>';
    return;
  }
  for (const s of DATA.sets) { SETS[s.id] = s; DATA.q[s.id].forEach((q, idx) => { QMAP[key(s.id, q.n)] = { q, sid: s.id, idx }; }); }
  route();
  initRemote();
}
boot();
})();
</script>
